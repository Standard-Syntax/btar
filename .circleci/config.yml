version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.14.10
    steps:
      - checkout
      - run:
          name: Install Bun 1.4.4
          command: .circleci/install-bun.sh
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Type check
          command: bun run typecheck
      - run:
          name: Build local CLI
          command: bun run build
      - run:
          name: Lint implementation
          command: bun run lint
      - run:
          name: Test implementation and CLI
          command: bun run test:coverage
      - run:
          name: Smoke test built CLI
          command: bun dist/cli.js --help
      - store_artifacts:
          path: coverage

  python-integration:
    docker:
      - image: cimg/python:3.14.10
    steps:
      - checkout
      - run:
          name: Install Bun 1.4.4
          command: .circleci/install-bun.sh
      - run:
          name: Install Hatch
          command: python -m pip install --user hatch==1.16.5
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - run:
          name: Verify Python integration
          command: bun run verify:python

workflows:
  verify:
    jobs:
      - verify
      - python-integration
