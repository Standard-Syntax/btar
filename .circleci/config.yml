version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:22.16
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Compile TypeScript
          command: npm run build
      - run:
          name: Type check
          command: npm run typecheck
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Verify readiness ratchet
          command: node dist/cli.js analyze . --json --ratchet > btar-report.json
      - store_artifacts:
          path: btar-report.json

workflows:
  verify:
    jobs:
      - verify
