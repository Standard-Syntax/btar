repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: '\.(ts|tsx|js|jsx|json|css|scss|md|ya?ml)$'
  - repo: local
    hooks:
      - id: typecheck
        name: Check btar implementation types
        entry: bun run typecheck
        language: system
        pass_filenames: false
      - id: lint
        name: Lint btar implementation
        entry: bun run lint
        language: system
        pass_filenames: false
